version: '3.7'

# Docker Compose setup for testing Ory Kratos verification
# This includes Kratos, a mail catcher (MailSlurper), and a database

services:
  # PostgreSQL database for Kratos
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    networks:
      - intranet
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Ory Kratos server
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://kratos:secret@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    networks:
      - intranet
    depends_on:
      - postgres

  kratos:
    image: oryd/kratos:v1.3.1
    ports:
      - "4433:4433" # Public API
      - "4434:4434" # Admin API
    environment:
      DSN: postgres://kratos:secret@postgres:5432/kratos?sslmode=disable
      LOG_LEVEL: debug
      LOG_LEAK_SENSITIVE_VALUES: "true"
      SERVE_PUBLIC_BASE_URL: http://localhost:4433
      SERVE_ADMIN_BASE_URL: http://localhost:4434
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: http://localhost:4455
      SELFSERVICE_FLOWS_ERROR_UI_URL: http://localhost:4455/error
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: http://localhost:4455/settings
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: http://localhost:4455/recovery
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: http://localhost:4455/verification
      SELFSERVICE_FLOWS_LOGIN_UI_URL: http://localhost:4455/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: http://localhost:4455/registration
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: http://localhost:4455/login
    volumes:
      - ./kratos-verification-example.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    networks:
      - intranet
    depends_on:
      - kratos-migrate
      - mailslurper

  # MailSlurper - Email catcher for development
  # Access at http://localhost:4436
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436" # Web UI
      - "4437:4437" # Service port
    networks:
      - intranet

  # Optional: Kratos Self-Service UI Node
  # Uncomment if you want a ready-made UI
  # kratos-selfservice-ui-node:
  #   image: oryd/kratos-selfservice-ui-node:v1.3.1
  #   ports:
  #     - "4455:4455"
  #   environment:
  #     KRATOS_PUBLIC_URL: http://kratos:4433
  #     KRATOS_BROWSER_URL: http://localhost:4433
  #     PORT: 4455
  #     SECURITY_MODE: standalone
  #   networks:
  #     - intranet
  #   depends_on:
  #     - kratos

networks:
  intranet:

volumes:
  postgres-data:
