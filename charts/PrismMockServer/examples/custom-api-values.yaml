# Example: Deploy Prism with a custom API specification

prism:
  replicaCount: 2
  options:
    cors: true
    validation: true
    dynamic: false
    errors: true

# Define your own API specification inline
spec:
  inline: |
    openapi: 3.0.0
    info:
      title: E-Commerce API
      description: A sample e-commerce API for demonstration
      version: 1.0.0
    servers:
      - url: https://api.example.com/v1
    paths:
      /products:
        get:
          summary: List all products
          parameters:
            - name: category
              in: query
              schema:
                type: string
            - name: limit
              in: query
              schema:
                type: integer
                default: 20
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      total:
                        type: integer
        post:
          summary: Create a new product
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductInput'
          responses:
            '201':
              description: Product created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Product'
      /products/{productId}:
        get:
          summary: Get product by ID
          parameters:
            - name: productId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Product'
            '404':
              description: Product not found
        put:
          summary: Update a product
          parameters:
            - name: productId
              in: path
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductInput'
          responses:
            '200':
              description: Product updated
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Product'
        delete:
          summary: Delete a product
          parameters:
            - name: productId
              in: path
              required: true
              schema:
                type: string
          responses:
            '204':
              description: Product deleted
      /orders:
        get:
          summary: List all orders
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        post:
          summary: Create a new order
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OrderInput'
          responses:
            '201':
              description: Order created
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Order'
    components:
      schemas:
        Product:
          type: object
          properties:
            id:
              type: string
              example: "prod-123"
            name:
              type: string
              example: "Laptop"
            description:
              type: string
              example: "High-performance laptop"
            price:
              type: number
              format: float
              example: 999.99
            category:
              type: string
              example: "Electronics"
            inStock:
              type: boolean
              example: true
            createdAt:
              type: string
              format: date-time
        ProductInput:
          type: object
          required:
            - name
            - price
          properties:
            name:
              type: string
            description:
              type: string
            price:
              type: number
              format: float
            category:
              type: string
            inStock:
              type: boolean
        Order:
          type: object
          properties:
            id:
              type: string
              example: "order-456"
            userId:
              type: string
              example: "user-789"
            products:
              type: array
              items:
                type: object
                properties:
                  productId:
                    type: string
                  quantity:
                    type: integer
            total:
              type: number
              format: float
              example: 1299.99
            status:
              type: string
              enum: [pending, processing, shipped, delivered, cancelled]
              example: "pending"
            createdAt:
              type: string
              format: date-time
        OrderInput:
          type: object
          required:
            - userId
            - products
          properties:
            userId:
              type: string
            products:
              type: array
              items:
                type: object
                required:
                  - productId
                  - quantity
                properties:
                  productId:
                    type: string
                  quantity:
                    type: integer

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
