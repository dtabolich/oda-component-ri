apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prism
  labels:
    app: {{ .Release.Name }}-prism
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.prism.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-prism
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-prism
        release: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: prism
        image: {{ .Values.prism.image }}
        imagePullPolicy: {{ .Values.prism.imagePullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        command:
          - prism
          - {{ .Values.prism.command }}
        args:
          - --host={{ .Values.prism.options.host }}
          - --port={{ .Values.prism.port }}
          {{- if .Values.prism.options.cors }}
          - --cors
          {{- end }}
          {{- if .Values.prism.options.dynamic }}
          - --dynamic
          {{- end }}
          {{- if .Values.prism.options.validation }}
          - --validate-request
          - --validate-response
          {{- end }}
          {{- if .Values.prism.options.errors }}
          - --errors
          {{- end }}
          {{- if .Values.spec.url }}
          - {{ .Values.spec.url }}
          {{- else }}
          - /etc/prism/openapi.yaml
          {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.prism.port }}
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        {{- if .Values.extraEnv }}
        env:
          {{- toYaml .Values.extraEnv | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- if not .Values.spec.url }}
        - name: openapi-spec
          mountPath: /etc/prism
          readOnly: true
        {{- end }}
        {{- if .Values.extraVolumeMounts }}
        {{- toYaml .Values.extraVolumeMounts | nindent 8 }}
        {{- end }}
      volumes:
      {{- if not .Values.spec.url }}
      - name: openapi-spec
        configMap:
          {{- if .Values.spec.existingConfigMap }}
          name: {{ .Values.spec.existingConfigMap }}
          {{- else }}
          name: {{ .Release.Name }}-prism-spec
          {{- end }}
          items:
          - key: {{ .Values.spec.configMapKey }}
            path: openapi.yaml
      {{- end }}
      {{- if .Values.extraVolumes }}
      {{- toYaml .Values.extraVolumes | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
