{{- if .Values.uiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kratos-auth.fullname" . }}-ui
  labels:
    {{- include "kratos-auth.labels" . | nindent 4 }}
    component: ui
spec:
  type: {{ .Values.uiService.service.type }}
  ports:
    - port: {{ .Values.uiService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kratos-auth.selectorLabels" . | nindent 4 }}
    component: ui
{{- end }}
