{{- if .Values.smsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kratos-auth.fullname" . }}-sms-service
  labels:
    {{- include "kratos-auth.labels" . | nindent 4 }}
    component: sms-service
spec:
  type: {{ .Values.smsService.service.type }}
  ports:
    - port: {{ .Values.smsService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kratos-auth.selectorLabels" . | nindent 4 }}
    component: sms-service
{{- end }}
