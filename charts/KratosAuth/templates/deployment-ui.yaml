{{- if .Values.uiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kratos-auth.fullname" . }}-ui
  labels:
    {{- include "kratos-auth.labels" . | nindent 4 }}
    component: ui
spec:
  replicas: {{ .Values.uiService.replicas }}
  selector:
    matchLabels:
      {{- include "kratos-auth.selectorLabels" . | nindent 6 }}
      component: ui
  template:
    metadata:
      labels:
        {{- include "kratos-auth.selectorLabels" . | nindent 8 }}
        component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.uiService.image.repository }}:{{ .Values.uiService.image.tag }}"
          imagePullPolicy: {{ .Values.uiService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.uiService.resources | nindent 12 }}
          env:
            - name: PORT
              value: "3000"
            - name: KRATOS_PUBLIC_URL
              value: "http://{{ include "kratos-auth.fullname" . }}-kratos-public:{{ .Values.kratos.service.public.port }}"
            - name: KRATOS_ADMIN_URL
              value: "http://{{ include "kratos-auth.fullname" . }}-kratos-admin:{{ .Values.kratos.service.admin.port }}"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kratos-auth.fullname" . }}-ui-secrets
                  key: session-secret
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
{{- end }}
