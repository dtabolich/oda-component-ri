{{- if .Values.smsService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kratos-auth.fullname" . }}-sms-secrets
  labels:
    {{- include "kratos-auth.labels" . | nindent 4 }}
    component: sms-service
type: Opaque
data:
  {{- if eq .Values.smsService.provider "twilio" }}
  twilio-account-sid: {{ .Values.smsService.twilio.accountSid | b64enc | quote }}
  twilio-auth-token: {{ .Values.smsService.twilio.authToken | b64enc | quote }}
  twilio-phone-number: {{ .Values.smsService.twilio.phoneNumber | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.smsService.provider "aws-sns" }}
  aws-access-key-id: {{ .Values.smsService.awsSns.accessKeyId | b64enc | quote }}
  aws-secret-access-key: {{ .Values.smsService.awsSns.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.smsService.provider "vonage" }}
  vonage-api-key: {{ .Values.smsService.vonage.apiKey | b64enc | quote }}
  vonage-api-secret: {{ .Values.smsService.vonage.apiSecret | b64enc | quote }}
  {{- end }}
{{- end }}
