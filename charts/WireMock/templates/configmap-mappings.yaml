apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wiremock-mappings
  labels:
    app: {{ .Release.Name }}-wiremock
data:
  {{- if .Values.mappings }}
  {{- range $index, $mapping := .Values.mappings }}
  mapping-{{ $index }}.json: |
{{ $mapping | toJson | indent 4 }}
  {{- end }}
  {{- else }}
  # Default mapping - health check
  health.json: |
    {
      "request": {
        "method": "GET",
        "url": "/health"
      },
      "response": {
        "status": 200,
        "jsonBody": {
          "status": "ok"
        }
      }
    }
  {{- end }}
